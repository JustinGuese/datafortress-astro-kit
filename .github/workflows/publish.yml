name: Publish to npm

# Publishing is driven by a version tag, so the released artifact always
# corresponds to a commit you can `git checkout`. `prepublishOnly` refuses to
# publish if the tag and package.json version disagree.
#
#   npm version minor && git push --follow-tags
on:
  push:
    tags: ['v*']

jobs:
  # Never publish something that has not passed CI. This runs the same job as
  # a normal push rather than a copy of it, so the two cannot drift.
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      # Required to mint the provenance attestation that links this tarball to
      # this commit and workflow. Without it, `provenance: true` in
      # package.json's publishConfig fails the publish.
      id-token: write
      # write, not read: the last step creates the GitHub release.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm >= 11.5.1; the Node 22 image ships npm 10.
      - name: Use an npm that speaks OIDC
        run: npm install -g npm@latest

      # No NODE_AUTH_TOKEN. npm sees the Actions OIDC env (that is what the
      # `id-token: write` permission above grants), exchanges the identity token
      # for a short-lived, single-publish credential, and attaches provenance
      # automatically. Nothing to rotate: granular tokens expire after 90 days
      # at most, an OIDC exchange expires in minutes.
      #
      # One-time setup on npmjs.com → the package → Settings → Trusted
      # publisher: GitHub Actions, JustinGuese/datafortress-astro-kit,
      # workflow `publish.yml`, no environment.
      #
      # Chicken-and-egg: that page only exists once the package does. Publish
      # the first version by hand (`npm login && npm publish` locally), then
      # configure the trusted publisher, and every tag after that goes through
      # here with no secret in the repo.
      - name: Publish
        run: npm publish
        # `access` and `provenance` come from publishConfig in package.json.

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)." \
            --verify-tag
